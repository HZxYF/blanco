<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blanco — identity</title>
  <style>
    body { margin: 0; background: #ccc; font-family: Georgia, serif; }

    .og {
      width: 1200px;
      height: 630px;
      box-sizing: border-box;
      padding: 0 100px;
      background: #15171b;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .og .rule {
      width: 120px;
      height: 4px;
      background: #c8a75a;
      margin-bottom: 46px;
    }

    .og .name {
      margin: 0 0 26px;
      font-size: 150px;
      line-height: 1;
      letter-spacing: -3px;
    }

    .og .sub {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 33px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #c8a75a;
    }

    .icon {
      width: 512px;
      height: 512px;
      background: #15171b;
      color: #c8a75a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 340px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="rule"></div>
    <p class="name">Blanco</p>
    <p class="sub">A Real Madrid history · 1902–2024</p>
  </div>

  <div class="icon">B</div>
</body>
</html>
